name: Ubuntu 24.04 Wayland native slice
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wayland-gles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7
        with:
          version: 0.10.14+7d59c7ec9
          core-version: 0.10.14+7d59c7ec9
      - name: Install native system APIs and CI compositor
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwayland-dev wayland-protocols libegl1-mesa-dev libgles2-mesa-dev libxkbcommon-dev libgl1-mesa-dri weston
          dpkg-query -W libwayland-dev wayland-protocols libegl1-mesa-dev libgles2-mesa-dev libxkbcommon-dev libgl1-mesa-dri weston
          moon version --all
      - name: Native lifecycle, visual readback, integer scale, recovery and disconnect
        run: sh scripts/test_ubuntu.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ubuntu-native-e2e
          path: _build/ubuntu-e2e/
