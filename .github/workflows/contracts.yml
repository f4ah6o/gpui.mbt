name: Contracts, M1 core, M2 element, and M3 scene foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate document contracts and release evidence ledger
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/check_contracts.py

  moonbit-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: 0.10.14+7d59c7ec9
          core-version: 0.10.14+7d59c7ec9
      - name: Prepare Ubuntu native system boundary
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwayland-dev wayland-protocols libegl1-mesa-dev libgles2-mesa-dev libxkbcommon-dev libpango1.0-dev libfontconfig1-dev fontconfig fonts-dejavu-core fonts-noto-cjk fonts-noto-color-emoji
          dpkg-query -W libpango1.0-dev libpango-1.0-0 libpangoft2-1.0-0 libfontconfig1-dev libfontconfig1 fontconfig fonts-dejavu-core fonts-noto-cjk fonts-noto-color-emoji
          pkg-config --modversion pangoft2 fontconfig
          sh scripts/prepare_ubuntu.sh
      - name: Show pinned toolchain
        run: moon version --all
      - name: Check formatting
        run: moon fmt --check
      - name: Check all targets with warnings denied
        run: moon check --target all --deny-warn
      - name: Test all targets with warnings denied
        env:
          FONTCONFIG_FILE: ${{ github.workspace }}/tests/linux_text/fonts.conf
          FONTCONFIG_PATH: ${{ github.workspace }}/tests/linux_text
          XDG_CACHE_HOME: ${{ runner.temp }}/gpui-contract-font-cache
        run: |
          mkdir -p "$XDG_CACHE_HOME"
          env -u DISPLAY -u WAYLAND_DISPLAY moon test --target all --deny-warn

  mcp-stdio-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: 0.10.14+7d59c7ec9
          core-version: 0.10.14+7d59c7ec9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.0
      - name: Build and test MoonBit MCP stdio endpoint and check generated inventory
        run: |
          moon version --all
          node --version
          sh scripts/test_mcp_stdio.sh

  macos-native-build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7
        with:
          version: 0.10.14+7d59c7ec9
          core-version: 0.10.14+7d59c7ec9
      - name: Build native app bundle and E2E runner; test portable contracts
        run: |
          mkdir -p _build/macos
          set -o pipefail
          moon version --all | tee _build/macos/toolchain.log
          moon test --package f4ah6o/gpui/accessibility --target native --deny-warn --no-parallelize 2>&1 | tee _build/macos/accessibility.log
          python3 -m unittest tests.test_accessibility_owner_id_allocator
          moon test --package f4ah6o/gpui/platform/macos --target native --deny-warn 2>&1 | tee _build/macos/headless.log
          ./script/build_and_run.sh --build 2>&1 | tee _build/macos/build.log
          ./script/test_macos.sh --build-only 2>&1 | tee _build/macos/e2e-build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-native-build
          path: _build/macos/
