name: macOS native GPU and input E2E
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-e2e:
    # Dedicated logged-in desktop with a Metal device. Never run untrusted PRs
    # automatically on this self-hosted machine.
    runs-on: [self-hosted, macOS, gpui-native]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7
        with:
          version: 0.10.14+7d59c7ec9
          core-version: 0.10.14+7d59c7ec9
      - name: Native evidence
        run: |
          mkdir -p _build/macos
          set -o pipefail
          git rev-parse HEAD | tee _build/macos/revision.log
          moon version --all | tee _build/macos/toolchain.log
          ./script/test_macos.sh 2>&1 | tee _build/macos/e2e.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-native-e2e
          path: _build/macos/
