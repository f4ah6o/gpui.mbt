name: Bootstrap browser lockfile

on:
  push:
    branches: [feat/browser-vite-plus]

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/browser-vite-plus
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          version: 1.0.0
          node-version: 24.11.0
          run-install: true
      - name: Commit generated lockfile
        run: |
          test -s pnpm-lock.yaml
          git config user.name f4ah6o
          git config user.email 14793610+f4ah6o@users.noreply.github.com
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: commit browser dependency lockfile [lockfile-bootstrap]"
          git push origin HEAD:feat/browser-vite-plus
